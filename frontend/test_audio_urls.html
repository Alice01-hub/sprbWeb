<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频URL测试</title>
</head>
<body>
    <h1>音频URL测试</h1>
    <div id="output"></div>
    
    <script type="module">
        // 模拟环境变量
        window.import = { meta: { env: { 
            VITE_OSS_BASE_URL: 'https://oss.sprb.love',
            VITE_OSS_AUDIO_PATH: '/public/audios'
        }}};
        
        // OSS配置
        const OSS_CONFIG = {
            BASE_URL: 'https://oss.sprb.love',
            AUDIO: {
                BASE: '/public/audios'
            },
            getFullUrl: (path) => `${OSS_CONFIG.BASE_URL}${path}`,
            getAudioUrl: (path) => OSS_CONFIG.getFullUrl(`${OSS_CONFIG.AUDIO.BASE}${path}`)
        };
        
        // 测试音频文件名
        const testFiles = [
            '1-水月陵 - Summer Pockets.mp3',
            '2-麻枝准 - Sea, You & Me.mp3',
            '3-鈴木このみ,VISUAL ARTS  Key - アルカテイル.mp3',
            '4-水月陵 - 夜は短く、空は遠くて….mp3',
            '5-高森奈津美 - 比翼の蝶たち.mp3',
            '6-嶺内ともみ - Departure!.mp3',
            '7-嶺内ともみ - with.mp3',
            '8-小原好美 - 夏に君を待ちながら.mp3',
            '9-岩井映美里,VISUAL ARTS  Key - 紬の夏休み.mp3',
            '10-岩井映美里 - Golden Hours.mp3',
            '11-鳴瀬しろは(CV.小原好美),加藤うみ(CV.田中あいみ),VISUAL ARTS  Key - 魔法の絵日記.mp3',
            '12-神山識(CV.ファイルーズあい),VISUAL ARTS  Key - Don\'t Cry Red.mp3',
            '13-水織静久(CV.小山さほみ),VISUAL ARTS  Key - 柔らかい記憶.mp3',
            '14-小原好美,VISUAL ARTS  Key - しろはの子守歌.mp3',
            '15-野村美樹(CV.一宮朔),VISUAL ARTS  Key - Dear Familiar.mp3',
            '16-鈴木このみ,VISUAL ARTS  Key - フィニステラー.mp3'
        ];
        
        const output = document.getElementById('output');
        
        testFiles.forEach((filename, index) => {
            const url = OSS_CONFIG.getAudioUrl(`/${filename}`);
            const div = document.createElement('div');
            div.innerHTML = `
                <p><strong>${index + 1}. ${filename}</strong></p>
                <p>URL: <a href="${url}" target="_blank">${url}</a></p>
                <hr>
            `;
            output.appendChild(div);
        });
        
        // 测试音频加载
        console.log('测试音频URL生成:');
        testFiles.forEach((filename, index) => {
            const url = OSS_CONFIG.getAudioUrl(`/${filename}`);
            console.log(`${index + 1}. ${filename} -> ${url}`);
        });
    </script>
</body>
</html>
